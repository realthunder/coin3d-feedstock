{% set name = "coin3d-rt" %}
{% set version = "20251011" %}
{% set superglue_version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/coin3d/coin/archive/refs/tags/{{ version }}.tar.gz
    sha256: b70169220a20eaf3db2420cbf739ea149cb48a78058964be20bb3377f9f534b5
    # patches:
    #   - patches/0001-Only-use-GLX-on-platforms-with-X11.patch

  - url: https://github.com/coin3d/superglu/archive/superglu-{{ superglue_version }}.tar.gz
    sha256: f408adcfb706e7c781db9c218ef9e8ba56d43995ccb61dffad5f6154c34f17d6
    folder: superglue
    patches:
      - patches/0002-superglue.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('coin3d-rt', max_pin='x.x') }}

requirements:
  build:
    - gnuconfig                          # [unix]
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - ninja
  host:
    - libboost-devel
    - libgl-devel     # [linux]
    - libglu          # [linux]
    - xorg-libxt      # [linux]
    - xorg-libxi      # [linux]
    - expat
  run:
    # - libboost
    - libglu          # [linux]
    - xorg-libxt      # [linux]
    - xorg-libxi      # [linux]
    - expat

# test:
#   requires:
#     - {{ compiler('c') }}
#     - {{ compiler('cxx') }}
#   files:
#     - test.cpp      # [linux]
#   commands:
#     - ${CXX} -o test test.cpp -Wl,-rpath-link -lCoin -L${PREFIX}/lib/ -I${PREFIX}/include/      # [linux]
#     - ./test      # [linux]
#     - where /r "%PREFIX%"  Coin4.dll      # [win]
#     - test -f ${PREFIX}/lib/libCoin.dylib      # [osx]

about:
  home: https://github.com/realthunder/coin
  license: BSD-3-Clause
  license_family: BSD
  license_file: COPYING
  summary: Coin3D with improved shadow renderering
  description: Coind3D with improved support of shadow rendering 

extra:
  recipe-maintainers:
    - realthunder
