{% set name = "coin3d-rt" %}
{% set version = "20251011" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/realthunder/coin/archive/refs/tags/{{ version }}.tar.gz
    sha256: b70169220a20eaf3db2420cbf739ea149cb48a78058964be20bb3377f9f534b5

  - url: https://github.com/realthunder/superglu/archive/refs/tags/v1.3.1-conda.tar.gz
    sha256: 1ff45bb0fa703eee730b51911acb0d14c46ba66adce01be5167b14694e123018
    folder: superglue

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('coin3d-rt', max_pin='x.x') }}

requirements:
  build:
    - gnuconfig                          # [unix]
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - ninja
  host:
    - libboost-devel 1.84
    - libgl-devel     # [linux]
    - libglu          # [linux]
    - xorg-libxt      # [linux]
    - xorg-libxi      # [linux]
    - libxcb 1.15     # [linux]
    - expat 2.5.0
  run:
    - libboost 1.84
    - libglu          # [linux]
    - xorg-libxt      # [linux]
    - xorg-libxi      # [linux]
    - expat 2.5.0

# test:
#   requires:
#     - {{ compiler('c') }}
#     - {{ compiler('cxx') }}
#   files:
#     - test.cpp      # [linux]
#   commands:
#     - ${CXX} -o test test.cpp -Wl,-rpath-link -lCoin -L${PREFIX}/lib/ -I${PREFIX}/include/      # [linux]
#     - ./test      # [linux]
#     - where /r "%PREFIX%"  Coin4.dll      # [win]
#     - test -f ${PREFIX}/lib/libCoin.dylib      # [osx]

about:
  home: https://github.com/realthunder/coin
  license: BSD-3-Clause
  license_family: BSD
  license_file: COPYING
  summary: Coin3D with improved shadow renderering
  description: Coind3D with improved support of shadow rendering 

extra:
  recipe-maintainers:
    - realthunder
