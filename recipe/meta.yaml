{% set name = "coin3d-rt" %}
{% set version = "20260915" %}
{# The fork's LinkVibe at that date: CoinRT, SoLazyElementEx, the MaterialX shader #}
{# source and COIN_BUILD_GL_STUB, all of which the program needs. #}
{% set rev = "d2da5cc9379d4f54ea00760d377ef661ac9dc102" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/realthunder/coin/archive/{{ rev }}.tar.gz
    sha256: c3350bfbd530c5a14f18028a4f98576502f9beff6854d1869ae19c882a483782

  - url: https://github.com/realthunder/superglu/archive/refs/tags/v1.3.1-conda.tar.gz
    sha256: 1ff45bb0fa703eee730b51911acb0d14c46ba66adce01be5167b14694e123018
    folder: superglue

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('coin3d-rt', max_pin='x.x') }}

requirements:
  build:
    - gnuconfig                          # [unix]
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - ninja
  host:
    # The stack's: smesh wants libboost >=1.90,<1.91, and one libboost is
    # resolved per environment.
    - libboost-devel 1.90
    - libgl-devel     # [linux]
    - libglu          # [linux]
    - xorg-libxt      # [linux]
    - xorg-libxi      # [linux]
    - libxcb          # [linux]
    - expat
  run:
    - libboost 1.90
    - libglu          # [linux]
    - xorg-libxt      # [linux]
    - xorg-libxi      # [linux]
    # Not pinned: occt wants libexpat >=2.8.1, so an old pin here left no
    # environment holding both.
    - expat

# test:
#   requires:
#     - {{ compiler('c') }}
#     - {{ compiler('cxx') }}
#   files:
#     - test.cpp      # [linux]
#   commands:
#     - ${CXX} -o test test.cpp -Wl,-rpath-link -lCoin -L${PREFIX}/lib/ -I${PREFIX}/include/      # [linux]
#     - ./test      # [linux]
#     - where /r "%PREFIX%"  Coin4.dll      # [win]
#     - test -f ${PREFIX}/lib/libCoin.dylib      # [osx]

about:
  home: https://github.com/realthunder/coin
  license: BSD-3-Clause
  license_family: BSD
  license_file: COPYING
  summary: Coin3D with improved shadow renderering
  description: Coind3D with improved support of shadow rendering 

extra:
  recipe-maintainers:
    - realthunder
